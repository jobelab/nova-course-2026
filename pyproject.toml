[project]
name = "nova-course2026"
version = "0.1.0"
description = "NOVA 2026 point-cloud tooling: CSF ground filtering, cross-section stem seeds, 3D Dijkstra tree instance segmentation"
requires-python = ">=3.12"
dependencies = [
    "laspy[lazrs]>=2.7",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "circle-fit>=0.2",
    "marimo>=0.23",
    "altair>=5.4",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "scikit-image>=0.24",
    "xarray>=2024.7",
    "cloth-simulation-filter>=1.1",
]

[project.optional-dependencies]
# Only needed to drive the TreeAIBox models (novatrees.treeaibox). Torch is large
# and CPU-only on this machine; the models still run, at about a minute per
# million points.
treeaibox = [
    # Pinned as a pair: timm imports torchvision, and a mismatched torch /
    # torchvision fails at import with "operator torchvision::nms does not exist".
    "torch==2.5.1",
    "torchvision==0.20.1",
    "timm>=1.0",
    "numpy-indexed>=0.3",
    "numpy-groupies>=0.11",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
nova-trees = "novatrees.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novatrees"]
